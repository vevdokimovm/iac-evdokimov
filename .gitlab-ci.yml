# все задачи выполняются на своём раннере: тег — маркер варианта
default:
  tags:
    - evdokimov-11

stages:
  - proverka

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Вариант 11, слово devlab"
    - shellcheck --version
    - find . -name '*.sh' -print
    - find . -name '*.sh' -exec shellcheck {} +
