# все задачи выполняются на своём раннере: тег — маркер варианта
default:
  tags:
    - evdokimov-11

stages:
  - proverka
  - stend

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Вариант 11, слово devlab"
    - shellcheck --version
    - find . -name '*.sh' -print
    - find . -name '*.sh' -exec shellcheck {} +
  # не запускать, если изменения не касаются скриптов и самого пайплайна
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.sh"
        - .gitlab-ci.yml

# синтаксис шаблона cloud-init; релаксированный набор правил: со строгим
# исправный файл не проходит из-за длинных строк
yamllint:
  stage: proverka
  image: alpine:3.20
  before_script:
    - apk add --no-cache yamllint >/dev/null
  script:
    - yamllint -d relaxed work-02/cloud-init.tpl.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - work-02/cloud-init.tpl.yaml
        - .gitlab-ci.yml

# заготовка: утилиты, yc и профиль с ключом из переменной проекта
.yc:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq gettext openssh-keygen >/dev/null
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a -i /usr/local >/dev/null
    - export PATH=/usr/local/bin:$PATH
    - yc config profile create ci
    - yc config set service-account-key "$YC_KEY_TEST"
    - yc config set cloud-id "$YC_CLOUD_ID"
    - yc config set folder-id "$YC_FOLDER_ID"

# ручная задача: запускается кнопкой, ресурсов не создаёт
proverka-dostupa:
  extends: .yc
  stage: proverka
  when: manual
  script:
    - echo "Проверяю доступ, вариант 11, слово devlab"
    - yc vpc network list

# ручная задача: стенд второй работы — создать, проверить, снести
stend-p2:
  extends: .yc
  stage: stend
  when: manual
  variables:
    PREFIX: evdokimov-11
    GREETING: devlab
    RUNNER_AFTER_SCRIPT_TIMEOUT: 15m
  script:
    - echo "Стенд второй работы из пайплайна, вариант 11, префикс $PREFIX, слово $GREETING"
    - ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
    - bash work-02/create.sh
    - bash work-02/check-lb.sh
  after_script:
    - export PATH=/usr/local/bin:$PATH
    - echo "Уборка стенда, префикс $PREFIX"
    - bash work-02/destroy.sh

# заготовка для проверок Terraform: у образа точка входа — сам terraform,
# а зеркала провайдеров внутри нет
.terraform:
  image:
    name: hashicorp/terraform:1.15.8
    entrypoint: [""] # иначе раннер запустит «terraform sh»
  before_script:
    - |
      cat > /tmp/terraformrc <<'EOF'
      provider_installation {
        network_mirror {
          url     = "https://terraform-mirror.yandexcloud.net/"
          include = ["registry.terraform.io/*/*"]
        }
        direct {
          exclude = ["registry.terraform.io/*/*"]
        }
      }
      EOF
    - export TF_CLI_CONFIG_FILE=/tmp/terraformrc

# формат манифеста; -recursive обязателен, иначе вложенные каталоги не проверяются
terraform-fmt:
  extends: .terraform
  stage: proverka
  script:
    - terraform fmt -check -diff -recursive

# разбор манифеста: провайдер ставится, хранилище состояния не трогается
terraform-validate:
  extends: .terraform
  stage: proverka
  script:
    - terraform -chdir=hw-02 init -backend=false
    - terraform -chdir=hw-02 validate
